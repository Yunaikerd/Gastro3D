<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1A12"/>
      <stop offset="50%" stop-color="#1F110B"/>
      <stop offset="100%" stop-color="#140A06"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C39E"/>
      <stop offset="100%" stop-color="#C89666"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Ambient Light Circle -->
  <circle cx="400" cy="270" r="160" fill="#C89666" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Geometric Frame -->
  <rect x="50" y="50" width="700" height="500" rx="24" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3"/>

  <!-- Cloche / Cup Icon Centered -->
  <g transform="translate(400, 260)" text-anchor="middle">
    <!-- Steam Lines -->
    <path d="M-25,-100 C-35,-80 -15,-60 -25,-40" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M0,-115 C-10,-95 10,-75 0,-55" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M25,-100 C15,-80 35,-60 25,-40" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Coffee Cup Silhouette -->
    <path d="M-60,-30 L60,-30 C58,35 35,55 0,55 C-35,55 -58,35 -60,-30 Z" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linejoin="round"/>
    <!-- Cup Handle -->
    <path d="M60,-15 C85,-15 85,25 54,25" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <!-- Saucer -->
    <path d="M-80,68 C-40,78 40,78 80,68" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Text Information -->
  <text x="400" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#E8C39E" text-anchor="middle" letter-spacing="3">
    FOTOGRAFÍA EN PREPARACIÓN
  </text>
  <text x="400" y="455" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#A89284" text-anchor="middle" letter-spacing="1">
    Gastro3D • Imagen Referencial Temporal
  </text>
</svg>
