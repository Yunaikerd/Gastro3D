<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B2219"/>
      <stop offset="100%" stop-color="#1F110B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D7B6"/>
      <stop offset="100%" stop-color="#C89666"/>
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="150" cy="150" r="140" fill="url(#logoBg)" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="150" cy="150" r="132" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Coffee Bean Motif -->
  <g transform="translate(150, 115) scale(0.9)" text-anchor="middle">
    <path d="M-30,-15 C-45,25 25,65 30,15 C45,-25 -25,-65 -30,-15 Z" fill="none" stroke="url(#gold)" stroke-width="4.5"/>
    <path d="M-18,-35 C-5,-10 5,10 18,35" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Brand Text -->
  <text x="150" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="4">
    COFFELIA
  </text>
  <text x="150" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#E0C9B6" text-anchor="middle" letter-spacing="2">
    COFFEE ROASTERS
  </text>
  <text x="150" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#C89666" text-anchor="middle" letter-spacing="1.5">
    [ PILOTO DEMOSTRATIVO ]
  </text>
</svg>
